<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ACJ StoryForge AI</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #0b0b12;
      color: #ffffff;
      min-height: 100vh;
    }

    .container {
      width: 92%;
      max-width: 850px;
      margin: auto;
      padding: 30px 0;
    }

    .header {
      text-align: center;
      margin-bottom: 30px;
    }

    .logo {
      font-size: 30px;
      font-weight: bold;
      letter-spacing: 1px;
    }

    .subtitle {
      color: #aaa;
      margin-top: 8px;
      font-size: 14px;
    }

    .card {
      background: #15151f;
      border: 1px solid #292938;
      border-radius: 18px;
      padding: 20px;
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-bottom: 10px;
      font-weight: bold;
    }

    textarea {
      width: 100%;
      min-height: 220px;
      resize: vertical;
      border: 1px solid #343445;
      border-radius: 12px;
      background: #0e0e16;
      color: white;
      padding: 15px;
      font-size: 15px;
      outline: none;
    }

    textarea:focus {
      border-color: #7777ff;
    }

    .options {
      display: grid;
      gap: 12px;
      margin-top: 20px;
    }

    .option {
      background: #0e0e16;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid #292938;
    }

    .option input {
      margin-right: 8px;
    }

    .generate {
      width: 100%;
      margin-top: 22px;
      padding: 15px;
      border: none;
      border-radius: 12px;
      background: #ffffff;
      color: #000000;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .generate:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    .generate:active {
      transform: scale(0.98);
    }

    .output {
      display: none;
    }

    .output h2 {
      margin-bottom: 15px;
    }

    .output-box {
      white-space: pre-wrap;
      background: #0e0e16;
      border: 1px solid #292938;
      border-radius: 12px;
      padding: 15px;
      color: #ccc;
      line-height: 1.6;
      overflow-wrap: anywhere;
    }

    .loading {
      color: #aaa;
      text-align: center;
      padding: 20px;
    }

    .error {
      color: #ff7777;
    }

    .footer {
      text-align: center;
      color: #666;
      font-size: 12px;
      margin-top: 30px;
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="header">
      <div class="logo">ACJ STORYFORGE AI</div>

      <div class="subtitle">
        Hindi Story → Anime Scenes → Video Prompts
      </div>
    </div>

    <div class="card">

      <label for="story">
        अपनी कहानी यहाँ लिखें
      </label>

      <textarea
        id="story"
        placeholder="अपनी पूरी कहानी यहाँ paste करें..."
      ></textarea>

      <div class="options">

        <div class="option">
          <label>
            <input type="checkbox" id="character" checked>
            Character Consistency
          </label>
        </div>

        <div class="option">
          <label>
            <input type="checkbox" id="image" checked>
            Anime Image Prompts
          </label>
        </div>

        <div class="option">
          <label>
            <input type="checkbox" id="video" checked>
            Video Prompts
          </label>
        </div>

      </div>

      <button
        class="generate"
        id="generateButton"
        onclick="generateProject()"
      >
        GENERATE PROJECT
      </button>

    </div>

    <div class="card output" id="output">

      <h2>Generated Project</h2>

      <div class="output-box" id="outputText"></div>

    </div>

    <div class="footer">
      © 2026 ACJ StoryForge AI
    </div>

  </div>


  <script>

    const API_URL =
      "https://acj-storyforge-api.hvhccybbuhbgbt.workers.dev";


    async function generateProject() {

      const story =
        document.getElementById("story").value.trim();

      const character =
        document.getElementById("character").checked;

      const image =
        document.getElementById("image").checked;

      const video =
        document.getElementById("video").checked;

      const button =
        document.getElementById("generateButton");

      const output =
        document.getElementById("output");

      const outputText =
        document.getElementById("outputText");


      if (!story) {

        alert("पहले अपनी कहानी लिखें।");

        return;
      }


      button.disabled = true;

      button.textContent = "GENERATING...";

      output.style.display = "block";

      outputText.className = "output-box loading";

      outputText.textContent =
        "AI आपकी कहानी को analyse कर रहा है...\n\nकृपया थोड़ा इंतज़ार करें।";


      output.scrollIntoView({
        behavior: "smooth"
      });


      try {

        const response = await fetch(
          API_URL,
          {
            method: "POST",

            headers: {
              "Content-Type": "application/json"
            },

            body: JSON.stringify({

              story: story,

              options: {
                characterConsistency: character,
                animeImagePrompts: image,
                videoPrompts: video
              }

            })
          }
        );


        const data = await response.json();


        if (!response.ok) {

          throw new Error(
            data.details ||
            data.error ||
            "AI request failed"
          );

        }


        if (!data.success) {

          throw new Error(
            data.error ||
            "Gemini ने कोई result नहीं दिया।"
          );

        }


        outputText.className = "output-box";

        outputText.textContent =
          data.result ||
          "कोई result प्राप्त नहीं हुआ।";


      } catch (error) {

        console.error(error);

        outputText.className =
          "output-box error";

        outputText.textContent =
          "❌ Generation failed\n\n" +
          error.message +
          "\n\nकृपया दोबारा कोशिश करें।";

      } finally {

        button.disabled = false;

        button.textContent =
          "GENERATE PROJECT";

      }

    }

  </script>

</body>
</html>
